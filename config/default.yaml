# Default configuration. A profile under profiles/ overrides only the
# keys it lists; nested mappings merge key by key.
# Durations follow DevSpec section 4.1.

sampling_interval_s: 1
results_root: /results
# Time a tool gets to exit by itself after its phase before the
# process group is stopped; 30 s is the gpu_burn -stts default.
stop_grace_s: 30

phases:
  preflight_s: 30
  idle_s: 60
  burn_warmup_s: 300
  burn_steady_s: 600
  cooldown_s: 120
  vram_s: 600
  optional_s: 300

gpu_burn:
  # gpu_burn -m N%; 90 % is the tool default.
  memory_percent: 90
  use_doubles: false
  use_tensor_cores: false
  # gpu_burn -stts: after the run it sends SIGTERM to its workers and
  # then sleeps this long unconditionally before printing the verdict.
  # The tool default of 30 s adds 30 s to every run and collided with
  # stop_grace_s, so the verdict was lost (LearnedPatterns L5).
  sigterm_timeout_s: 5

cuda_memtest:
  # --stress equals --disable_all --enable_test 10 --exit_on_error.
  stress: true

# auto picks memtest_vulkan for consumer and dcgm_diag for datacenter;
# workstation has no optional runner. none disables the phase.
optional_runner: auto

evaluation:
  # gpu-fryer default tolerance is 10 % below the fastest GPU.
  gpu_ratio_min: 0.90
