# Continuous integration. GitHub runners have no GPU, so CI covers
# linting, fixture tests, and (from M1b) the image build only. A green
# run never replaces the hardware verification in CommonClaude 5.1.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with dev dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with dev dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: pytest -q
