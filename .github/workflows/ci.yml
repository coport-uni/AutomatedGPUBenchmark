# Continuous integration. GitHub runners have no GPU, so CI covers
# linting, fixture tests, and (from M1b) the image build only. A green
# run never replaces the hardware verification in CommonClaude 5.1.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with dev dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with dev dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: pytest -q

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for the CUDA images
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: gpubench:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Tool binaries answer --help without a GPU
        # The runner has no driver, so the CUDA stubs stand in for
        # libcuda.so.1 and libnvidia-ml.so.1 (see Dockerfile).
        # cuda_memtest exits 25 after printing its usage, so the check
        # is on the output rather than on the exit status.
        run: |
          docker run --rm -e LD_LIBRARY_PATH=/opt/cuda-stubs gpubench:ci gpu_burn -h \
            | grep 'Usage: gpu-burn'
          docker run --rm -e LD_LIBRARY_PATH=/opt/cuda-stubs gpubench:ci cuda_memtest --help \
            | grep 'Usage:cuda_memtest'
          docker run --rm gpubench:ci gpubench --version
      - name: Report tests with LibreOffice and the OOXML schemas
        # The host job skips the schema and PDF tests; inside the image
        # none of them may be skipped. An explicit bash shell adds
        # pipefail, so a pytest failure is not hidden by tee.
        shell: bash
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            -e PYTHONDONTWRITEBYTECODE=1 gpubench:ci sh -c \
            'pip install --quiet pytest \
              && pytest -q -p no:cacheprovider -rs tests/test_report.py' \
            | tee report-tests.log
          ! grep -q SKIPPED report-tests.log
